# Read the Docs configuration file for HemoCell.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    # Doxygen + Graphviz are required: Sphinx invokes Doxygen during the build
    # (see doc/user_guide/conf.py) to generate the C++ API reference.
    - doxygen
    - graphviz

sphinx:
  configuration: doc/user_guide/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: doc/requirements.txt

# Build additional output formats (a downloadable PDF + ePub of the manual).
formats:
  - pdf
  - epub
